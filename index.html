<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3261E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보슐랭">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>보슐랭 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --ink:#1F2A37; --sub:#6B7280; --line:#E8E1D6;
  --red:#B3261E; --red-soft:#F7E6E3; --navy:#1E3A5F; --green:#2E7D4F; --soft:#EFE8DC;
  --yw:#2F5D8A; --bs:#D9667A; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font-family:inherit}
.hidden{display:none!important}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:rgba(250,246,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{color:var(--red)}
.icon-btn{border:0;background:none;font-size:20px;padding:6px 8px;cursor:pointer;color:var(--ink)}
.view{max-width:760px;margin:0 auto;padding:14px 16px 28px}
.view.map-view{max-width:none;padding:0;position:relative}

/* 하단 탭 */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabs a .i{font-size:21px;line-height:1.2}
.tabs a.on{color:var(--red);font-weight:700}
.tabs a.add .i{background:var(--red);color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-24px;box-shadow:0 4px 12px rgba(179,38,30,.35)}
.side-brand{display:none;font-weight:900;font-size:21px;color:var(--red);padding:6px 14px 20px;letter-spacing:-.5px}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:220px}
  .tabs{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;align-items:stretch;border-top:0;border-right:1px solid var(--line);padding:22px 12px;gap:4px}
  .side-brand{display:block}
  .tabs a{flex:0 0 auto;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:10px}
  .tabs a.on{background:var(--red-soft)}
  .tabs a.add .i{width:auto;height:auto;margin:0;background:none;color:inherit;box-shadow:none;font-size:21px}
  .view{max-width:900px}
}

/* 공통 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:700;color:var(--sub);margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title:first-child{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:#EBC4C0}
.btn.ghost{background:none;border-color:transparent;color:var(--sub)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--red);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:6px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:600;color:var(--sub);cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.meta{font-size:12.5px;color:var(--sub)}
.center{text-align:center}
.empty{text-align:center;color:var(--sub);padding:36px 10px;font-size:14px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=checkbox]{width:18px;height:18px;-webkit-appearance:checkbox;appearance:auto;vertical-align:middle;margin:0 6px 0 0}
textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;font-size:14px;margin:6px 0;cursor:pointer}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--sub);flex:none}
.kv span:last-child{text-align:right}
.who1{color:var(--yw);font-weight:700}
.who2{color:var(--bs);font-weight:700}

/* 장소 목록 */
.pitem{display:flex;gap:12px;align-items:center;padding:11px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;cursor:pointer}
.thumb{width:62px;height:62px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pbody{flex:1;min-width:0}
.pname{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff;vertical-align:middle;white-space:nowrap}
.grade.big{font-size:14px;padding:4px 10px;border-radius:8px}
.tier{font-weight:800;color:var(--green);font-size:13px;letter-spacing:-1px}
.status{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--sub);font-weight:700;white-space:nowrap}

/* 장소 상세 */
.hero{border-radius:var(--radius);overflow:hidden;background:var(--soft);height:190px;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:12px}
.hero img{width:100%;height:100%;object-fit:cover}
.pd-name{font-size:22px;font-weight:800;margin:0 0 6px;letter-spacing:-.4px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-bottom:10px}
.vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.oneline{font-size:14px;margin:4px 0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee;display:block;cursor:pointer}

/* 기록 폼 */
.score{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.score span{width:68px;font-size:13px;flex:none}
.score button{width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--ink)}
.score button.on{background:var(--red);color:#fff;border-color:var(--red)}
.irow{display:grid;grid-template-columns:1fr 92px 52px 36px 28px;gap:5px;margin-bottom:6px;align-items:center}
.irow input{padding:8px;font-size:15px}
.irow .rec{border:1px solid var(--line);background:#fff;border-radius:8px;height:38px;cursor:pointer;filter:grayscale(1);opacity:.5}
.irow .rec.on{filter:none;opacity:1;border-color:var(--green)}
.erow{display:grid;grid-template-columns:1fr 110px 28px;gap:5px;margin-bottom:6px}
.erow input{padding:8px;font-size:15px}
.x{border:0;background:none;color:var(--sub);font-size:16px;cursor:pointer}
.phgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.add{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--sub);cursor:pointer;border:1.5px dashed #CFC6B8;background:#fff}
.ph .phx{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer}
.ph .phc,.ph .phr{position:absolute;bottom:3px;border:0;border-radius:6px;font-size:10.5px;padding:2px 5px;background:rgba(255,255,255,.85);color:var(--ink);cursor:pointer}
.ph .phc{left:3px}.ph .phr{right:3px}
.ph .phc.on{background:var(--red);color:#fff}.ph .phr.on{background:var(--navy);color:#fff}
.ph .rcpt{position:absolute;right:3px;bottom:3px;font-size:10.5px;background:var(--navy);color:#fff;border-radius:6px;padding:2px 5px}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
@media (min-width:900px){.savebar{bottom:0}}

/* 홈 */
.hello{font-size:21px;font-weight:800;margin:4px 2px 14px;letter-spacing:-.4px}
.random-btn{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:16px;padding:18px;background:linear-gradient(135deg,#B3261E,#7E1A15);color:#fff;text-align:left;cursor:pointer;margin-bottom:12px}
.random-btn .d{font-size:36px}
.random-btn b{font-size:17px;display:block}
.random-btn small{opacity:.85}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 10px}
.stat .n{font-size:17px;font-weight:800;letter-spacing:-.3px}
.stat .l{font-size:11.5px;color:var(--sub)}
.alert{display:flex;align-items:center;gap:10px;background:var(--red-soft);border:1px solid #EBC4C0;border-radius:12px;padding:11px 13px;margin-bottom:10px;cursor:pointer;font-size:14px}
.alert b{color:var(--red)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.mini .mimg{height:96px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:30px}
.mini .mimg img{width:100%;height:100%;object-fit:cover}
.mini .mb{padding:8px 9px}
.mini .mn{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 지도 */
#map{width:100%;height:calc(100vh - 58px - 76px);height:calc(100dvh - 58px - 76px - env(safe-area-inset-bottom) - env(safe-area-inset-top))}
@media (min-width:900px){#map{height:calc(100vh - 58px)}}
.map-ctl{position:absolute;top:8px;left:8px;right:8px;z-index:5}
.map-ctl .chips{margin-bottom:4px}
.map-ctl .chip{box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pin{transform:translateY(-4px);min-width:28px;height:28px;padding:0 7px;border-radius:14px;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;cursor:pointer;white-space:nowrap}
.pin.wish{background:#fff!important;color:var(--ink);border:2px dashed var(--red)}
.mapcard{position:absolute;left:10px;right:10px;bottom:12px;z-index:6;background:#fff;border-radius:14px;padding:13px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.locbtn{position:absolute;right:12px;bottom:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;cursor:pointer}
.mapcard:not(.hidden) ~ .locbtn{bottom:130px}

/* 랜덤 여행 */
.slot{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:8px}
.slot.locked{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy)}
.slot-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.slot-tag{font-size:12px;font-weight:800;color:var(--red)}
.slot-name{font-size:16px;font-weight:800}
.slot-b{display:flex;gap:6px;margin-top:8px}
.tripmap{height:230px;border-radius:var(--radius);overflow:hidden;margin-bottom:12px;background:var(--soft)}
.daylabel{font-weight:800;color:var(--navy);margin:14px 2px 8px}

/* 통계 */
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;background:var(--red);border-radius:4px 4px 0 0;min-height:2px}
.bars .b span{font-size:10px;color:var(--sub);margin-top:3px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hbar .hl{width:96px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .ht{flex:1;background:var(--soft);border-radius:6px;height:12px;overflow:hidden}
.hbar .ht i{display:block;height:100%;background:var(--navy);border-radius:6px}
.hbar .hv{width:84px;text-align:right;flex:none;color:var(--sub);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--sub);font-weight:600}
table.t td.r,table.t th.r{text-align:right}

/* 에디션 */
.edition{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 20px}
.ed-cover{text-align:center;border-bottom:2px solid var(--red);padding-bottom:18px;margin-bottom:8px}
.ed-cover .y{font-size:13px;letter-spacing:6px;color:var(--red);font-weight:800}
.ed-cover h2{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
.ed-sec{margin-top:22px}
.ed-sec h3{font-size:16px;margin:0 0 4px;color:var(--navy)}
.ed-sec .d{font-size:12px;color:var(--sub);margin-bottom:10px}
.ed-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);break-inside:avoid}
.ed-item .thumb{width:72px;height:72px}

/* 모달, 토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 14px;font-size:18px}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.logo-big{font-size:38px;font-weight:900;color:var(--red);letter-spacing:-1px;text-align:center;line-height:1.05}
.logo-big small{font-size:14px;letter-spacing:8px;color:var(--navy)}
.pick{display:flex;gap:14px}
.pick button{width:130px;height:130px;border-radius:24px;border:0;color:#fff;font-size:22px;font-weight:800;cursor:pointer}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}

@media print{
  .tabs,.top,.no-print{display:none!important}
  body{padding:0!important;background:#fff}
  .view{max-width:none;padding:0}
  .edition{border:0;padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================
   보슐랭 가이드 v1
   아래 3줄만 채우면 됩니다.
   ===================================================== */
const CONFIG = {
  SUPABASE_URL: '',   // 예: https://abcdefgh.supabase.co
  SUPABASE_KEY: '',   // anon key 또는 publishable key (service_role 키 절대 X)
  KAKAO_JS_KEY: '',   // 카카오 JavaScript 키
};
const APP_VERSION = '1.0.0';

/* ===================== 상수 ===================== */
const PROFILES = { 1:{name:'영웅', color:'#2F5D8A'}, 2:{name:'보실', color:'#D9667A'} };
const otherOf = id => id === 1 ? 2 : 1;
const CAT = {
  food:{label:'음식', icon:'🍽️'},
  play:{label:'놀거리', icon:'🎡'},
  stay:{label:'숙박', icon:'🏨'},
};
const GRADES = {
  '3star':     {label:'보슐랭 3스타', short:'★★★', color:'#B3261E', desc:'이것 때문에 일부러 찾아갈 가치가 있는 곳', num:3},
  '2star':     {label:'보슐랭 2스타', short:'★★',  color:'#C2410C', desc:'근처에 가면 꼭 들를 곳', num:2},
  '1star':     {label:'보슐랭 1스타', short:'★',   color:'#D97706', desc:'훌륭한 곳', num:1},
  'bogourmand':{label:'보구르망',     short:'🍙',  color:'#2E7D4F', desc:'가성비가 좋은 곳', num:1},
  'selection': {label:'보슐랭 셀렉션', short:'📌',  color:'#5B6B7A', desc:'무난하고 괜찮은 곳', num:0.5},
  'no':        {label:'재방문 X',     short:'✕',   color:'#9CA3AF', desc:'다시는 안 가는 곳', num:0},
};
const GRADE_ORDER = ['3star','2star','1star','bogourmand','selection','no'];
const SCORE_ITEMS = {
  food:['맛','분위기','서비스','가성비','웨이팅'],
  play:['재미','접근성','혼잡도','가성비','재방문'],
  stay:['청결','위치','시설','침구·방음','가성비'],
};
// 가격대 경계 (음식·놀거리: 1인 / 숙박: 1박)
const TIERS = { food:[10000,30000,70000], play:[10000,30000,70000], stay:[70000,150000,300000] };

function haversine(a, b){
  const R = 6371, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function q(promise){ const { data, error } = await promise; if(error){ console.error(error); throw new Error(error.message); } return data; }
async function loadAll(){
  const tables = ['places','visits','visit_scores','visit_payments','visit_items','photos','trips','trip_stops'];
  const res = await Promise.all(tables.map(t => sb.from(t).select('*').range(0, 9999)));
  res.forEach((r,i) => { if(r.error) throw new Error(`${tables[i]}: ${r.error.message}`); });
  [S.places, S.visits, S.scores, S.payments, S.items, S.photos, S.trips, S.stops] = res.map(r => r.data || []);
  S.loaded = true; S.lastLoad = Date.now();
}
async function hydratePhotos(root=document){
  if(!sb) return;
  if(Date.now() - S.photoUrlsAt > 5*3600*1000){ S.photoUrls = {}; S.photoUrlsAt = Date.now(); }
  const imgs = $$('img[data-path]', root);
  const need = [...new Set(imgs.map(i=>i.dataset.path).filter(p => !S.photoUrls[p]))];
  if(need.length){
    const { data, error } = await sb.storage.from('photos').createSignedUrls(need, 6*3600);
    if(!error && data) data.forEach(d => { if(d.signedUrl && d.path) S.photoUrls[d.path] = d.signedUrl; });
  }
  imgs.forEach(i => { const u = S.photoUrls[i.dataset.path]; if(u && i.getAttribute('src') !== u) i.src = u; });
}
async function resizeImage(file, max=1600, quality=0.8){
  let src, w, h;
  try { src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch(e){
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
}

let kakaoPromise = null;
function loadKakao(){
  if(kakaoPromise) return kakaoPromise;
  kakaoPromise = new Promise((res, rej) => {
    if(!CONFIG.KAKAO_JS_KEY){ kakaoPromise = null; return rej(new Error('카카오 JavaScript 키가 설정되지 않았어요')); }
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&libraries=services&autoload=false`;
    s.onload = () => { try { kakao.maps.load(() => res(window.kakao)); } catch(e){ kakaoPromise = null; rej(new Error('카카오 지도 초기화 실패 (도메인 등록, 카카오맵 사용 설정 확인)')); } };
    s.onerror = () => { kakaoPromise = null; rej(new Error('카카오 지도를 불러오지 못했어요 (도메인 등록 확인)')); };
    document.head.appendChild(s);
  });
  return kakaoPromise;
}
async function kakaoKeyword(query, opts={}){
  const k = await loadKakao(); const ps = new k.maps.services.Places();
  return new Promise(res => ps.keywordSearch(query, (data, status) => res(status === k.maps.services.Status.OK ? data : []), opts));
}
async function kakaoCategory(code, center, radiusM, page=1){
  const k = await loadKakao(); const ps = new k.maps.services.Places();
  return new Promise(res => ps.categorySearch(code, (data, status) => res(status === k.maps.services.Status.OK ? data : []), {
    location: new k.maps.LatLng(center.lat, center.lng), radius: Math.min(20000, Math.round(radiusM)), page,
  }));
}
async function geocode(text){
  const k = await loadKakao(); const g = new k.maps.services.Geocoder();
  const r = await new Promise(res => g.addressSearch(text, (d, st) => res(st === k.maps.services.Status.OK && d.length ? d[0] : null)));
  if(r) return { lat:+r.y, lng:+r.x, address:r.address_name };
  const kw = await kakaoKeyword(text);
  if(kw.length) return { lat:+kw[0].y, lng:+kw[0].x, address:kw[0].address_name };
  return null;
}
function regionFromAddress(addr){ const t = (addr||'').split(' ').filter(Boolean); return t.slice(0,2).join(' '); }
function kakaoCatOf(d){
  const c = d.category_group_code, n = d.category_name || '';
  if(c === 'FD6' || c === 'CE7' || /^음식점/.test(n)) return 'food';
  if(c === 'AD5' || /숙박/.test(n)) return 'stay';
  return 'play';
}
function kakaoSubOf(d){ const segs = (d.category_name||'').split('>').map(s=>s.trim()).filter(Boolean); return segs.slice(1,3).join(' · ') || segs[0] || ''; }
function kakaoToPlace(d){
  return { name:d.place_name, category:kakaoCatOf(d), sub_category:kakaoSubOf(d), address:d.address_name||null,
    road_address:d.road_address_name||null, lat:+d.y, lng:+d.x, kakao_place_id:String(d.id),
    region:regionFromAddress(d.address_name), phone:d.phone||null };
}
function getPos(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej(new Error('위치 기능을 쓸 수 없어요'));
    navigator.geolocation.getCurrentPosition(p => { S.lastPos = { lat:p.coords.latitude, lng:p.coords.longitude }; res(S.lastPos); },
      () => rej(new Error('위치 권한이 필요해요')), { enableHighAccuracy:false, timeout:10000, maximumAge:300000 });
  });
}

const ROUTES = [
  [/^#\/home$/, () => renderHome()],
  [/^#\/guide$/, () => renderGuide()],
  [/^#\/add$/, () => renderAdd()],
  [/^#\/map$/, () => renderMap()],
  [/^#\/memory$/, () => renderMemory()],
  [/^#\/place\/([\w-]+)$/, m => renderPlace(m[1])],
  [/^#\/visit\/new\/([\w-]+)$/, (m, qs) => renderVisitForm({ placeId:m[1], tripId:qs.get('trip') })],
  [/^#\/visit\/edit\/([\w-]+)$/, m => renderVisitForm({ visitId:m[1] })],
  [/^#\/trip\/new$/, () => renderTripNew()],
  [/^#\/trip\/([\w-]+)$/, m => renderTrip(m[1])],
];
function renderRoute(){
  const [path, qsStr] = (location.hash || '#/home').split('?');
  const qs = new URLSearchParams(qsStr || '');
  let r = null;
  for(const [re, fn] of ROUTES){ const m = path.match(re); if(m){ r = fn(m, qs); break; } }
  if(!r){ go('#/home'); return; }
  $('#app').innerHTML = shell(r.title, r.body, r.opts || {});
  hydratePhotos();
  if(r.after) r.after();
}

/* ===================== 홈 ===================== */
function renderHome(){
  const today = todayStr(), ym = today.slice(0,7), now = parseLocal(today);
  const mv = S.visits.filter(v => (v.visited_at||'').startsWith(ym));
  const mvIds = new Set(mv.map(v=>v.id));
  const paid = pid => sum(S.payments.filter(p => p.profile_id === pid && mvIds.has(p.visit_id)).map(p=>p.amount));
  const recent = [...S.visits].sort(byDateDesc).slice(0, 8);
  const undone = S.visits.filter(v => !v.is_detail_done);
  const upcoming = S.trips.filter(t => !t.start_date || (t.end_date||t.start_date) >= today)
    .sort((a,b) => (a.start_date||'9999').localeCompare(b.start_date||'9999')).slice(0,3);

  // 다녀오셨나요?
  const ask = [];
  S.trips.forEach(t => {
    const end = t.end_date || t.start_date; if(!end || end > today) return;
    S.stops.filter(s => s.trip_id === t.id).forEach(s => {
      const p = placeById(s.place_id);
      if(p && p.status === 'planned' && !S.visits.some(v => v.place_id === p.id && v.trip_id === t.id)) ask.push({ p, t });
    });
  });

  // N년 전 오늘
  const memories = S.visits.filter(v => {
    const d = parseLocal(v.visited_at); if(d.getFullYear() >= now.getFullYear()) return false;
    const same = new Date(now.getFullYear(), d.getMonth(), d.getDate());
    return Math.abs(same - now) <= 3*864e5;
  }).sort(byDateDesc).slice(0,4);

  const wishes = S.places.filter(p => p.status !== 'visited');
  let nearHtml = '';
  if(S.ui.near){
    nearHtml = S.ui.near.length ? S.ui.near.map(({p,d}) => placeItem(p, kmText(d))).join('') : '<div class="empty">5km 안에 위시가 없어요</div>';
  }

  const installCard = (!isStandalone() && lsGet('bos_install_hide') !== '1') ? `
    <div class="alert" onclick="showInstallGuide()">📲 <span>홈 화면에 앱으로 설치하면 더 편해요 <b>설치 방법</b></span>
    <button class="x" onclick="event.stopPropagation();lsSet('bos_install_hide','1');renderRoute()">✕</button></div>` : '';

  const body = `
  ${installCard}
  <div class="hello">${PROFILES[S.profile].name}, 오늘은 어디 갈까요?</div>
  <button class="random-btn" onclick="go('#/trip/new')"><span class="d">🎲</span><span><b>랜덤 여행 뽑기</b><small>지역만 정하면 코스를 짜 드려요</small></span></button>
  ${ask.length ? ask.slice(0,3).map(({p,t}) => `<div class="alert" onclick="go('#/visit/new/${p.id}?trip=${t.id}')">🙋 <span><b>다녀오셨나요?</b> ${esc(p.name)} 기록하기</span></div>`).join('') : ''}
  ${undone.length ? `<div class="alert" onclick="openUndone()">📝 <span>기록 마무리하기 <b>${undone.length}건</b></span></div>` : ''}

  <div class="sec-title">이번 달 (${now.getMonth()+1}월)</div>
  <div class="stat-row">
    <div class="stat"><div class="n">${won(sum(mv.map(v=>v.total_amount)))}</div><div class="l">총 지출 · ${mv.length}회</div></div>
    <div class="stat"><div class="n who1">${won(paid(1))}</div><div class="l">영웅이 낸 돈</div></div>
    <div class="stat"><div class="n who2">${won(paid(2))}</div><div class="l">보실이 낸 돈</div></div>
  </div>

  ${upcoming.length ? `<div class="sec-title">다가오는 여행</div>${upcoming.map(tripItem).join('')}` : ''}

  ${memories.length ? `<div class="sec-title">📅 N년 전 이맘때</div><div class="hscroll">${memories.map(v => {
    const p = placeById(v.place_id); const yrs = now.getFullYear() - parseLocal(v.visited_at).getFullYear();
    return miniCard(p, coverOfVisit(v.id), `${yrs}년 전 · ${fmtDateShort(v.visited_at)}`);
  }).join('')}</div>` : ''}

  <div class="sec-title">최근 방문 <button class="link" onclick="go('#/memory')">전체</button></div>
  ${recent.length ? `<div class="hscroll">${recent.map(v => { const p = placeById(v.place_id); return miniCard(p, coverOfVisit(v.id), fmtDate(v.visited_at)); }).join('')}</div>`
    : `<div class="card empty">아직 기록이 없어요.<br>가운데 <b>＋</b> 버튼으로 첫 기록을 남겨 보세요!</div>`}

  <div class="sec-title">💭 가고 싶은 곳 ${wishes.length}곳 <button class="link" onclick="findNear()">📍 근처 위시 찾기</button></div>
  ${nearHtml || (wishes.length ? wishes.slice(0,3).map(p => placeItem(p)).join('') + (wishes.length>3 ? `<button class="btn full" onclick="S.ui.guide.seg='wish';go('#/guide')">전체 보기</button>` : '') : '<div class="meta">공유하기나 ＋ 버튼으로 가고 싶은 곳을 모아 보세요</div>')}
  `;
  return { title:'<span class="brand">보슐랭</span> 가이드', body };
}
function miniCard(p, ph, sub){

  return `<div class="mini" onclick="go('#/place/${p.id}')">${thumbHtml(ph, catIcon(p.category), 'mimg')}

function tripItem(t){
  const n = S.stops.filter(s => s.trip_id === t.id).length;

  return `<div class="pitem" onclick="go('#/trip/${t.id}')"><div class="thumb">${t.is_random?'🎲':'🧳'}</div>

async function findNear(){
  try { const pos = await getPos();

    <div class="meta">${meta}</div></div></div>`;
}
function renderGuide(){
  const g = S.ui.guide;
  const regions = [...new Set(S.places.map(p=>p.region).filter(Boolean))].sort();
  let list = S.places.filter(p => g.seg === 'visited' ? p.status === 'visited' : p.status !== 'visited');
  if(g.cat !== 'all') list = list.filter(p => p.category === g.cat);
  if(g.grade !== 'all') list = list.filter(p => g.grade === 'none' ? !p.grade : p.grade === g.grade);
  if(g.tier !== 'all') list = list.filter(p => String(p.price_tier) === g.tier);
  if(g.region !== 'all') list = list.filter(p => p.region === g.region);
  if(g.q) list = list.filter(p => (p.name+' '+(p.sub_category||'')+' '+(p.memo||'')+' '+(p.tags||[]).join(' ')).toLowerCase().includes(g.q.toLowerCase()));
  const last = p => visitsOf(p.id)[0]?.visited_at || '';
  const sorters = {
    recent: (a,b) => (last(b)||b.created_at).localeCompare(last(a)||a.created_at),
    grade: (a,b) => (GRADE_ORDER.indexOf(a.grade)+1||99) - (GRADE_ORDER.indexOf(b.grade)+1||99),
    count: (a,b) => visitsOf(b.id).length - visitsOf(a.id).length,
    price_low: (a,b) => (a.price_tier||9) - (b.price_tier||9),
    price_high: (a,b) => (b.price_tier||0) - (a.price_tier||0),
    added: (a,b) => (b.created_at||'').localeCompare(a.created_at||''),
  };
  list.sort(sorters[g.sort] || sorters.recent);
  const cnt = { visited:S.places.filter(p=>p.status==='visited').length, wish:S.places.filter(p=>p.status!=='visited').length };
  const body = `
  <div class="seg">
    <button class="${g.seg==='visited'?'on':''}" onclick="setGuide('seg','visited')">가본 곳 ${cnt.visited}</button>
    <button class="${g.seg==='wish'?'on':''}" onclick="setGuide('seg','wish')">가고 싶은 곳 ${cnt.wish}</button>
  </div>
  <div class="chips">
    ${[['all','전체'],['food','🍽️ 음식'],['play','🎡 놀거리'],['stay','🏨 숙박']].map(([k,l]) => `<button class="chip ${g.cat===k?'on':''}" onclick="setGuide('cat','${k}')">${l}</button>`).join('')}
  </div>
  <div class="row" style="margin-bottom:8px">
    <select onchange="setGuide('grade',this.value)"><option value="all">등급 전체</option>${GRADE_ORDER.map(k=>`<option value="${k}" ${g.grade===k?'selected':''}>${GRADES[k].short} ${GRADES[k].label}</option>`).join('')}<option value="none" ${g.grade==='none'?'selected':''}>등급 없음</option></select>
    <select onchange="setGuide('tier',this.value)"><option value="all">가격대 전체</option>${[1,2,3,4].map(t=>`<option value="${t}" ${g.tier===String(t)?'selected':''}>${tierText(t)}</option>`).join('')}</select>
  </div>
  <div class="row" style="margin-bottom:8px">
    <select onchange="setGuide('region',this.value)"><option value="all">지역 전체</option>${regions.map(r=>`<option ${g.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
    <select onchange="setGuide('sort',this.value)">${[['recent','최근 방문순'],['grade','등급순'],['count','방문 횟수순'],['price_low','가격 낮은순'],['price_high','가격 높은순'],['added','최근 추가순']].map(([k,l])=>`<option value="${k}" ${g.sort===k?'selected':''}>${l}</option>`).join('')}</select>
  </div>
  <input placeholder="🔎 이름, 메모, 태그 검색" value="${esc(g.q)}" oninput="S.ui.guide.q=this.value;clearTimeout(window._gq);window._gq=setTimeout(()=>{renderRoute();const i=$('main input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)" style="margin-bottom:12px">
  ${list.length ? list.map(p => placeItem(p)).join('') : `<div class="empty">${g.seg==='visited' ? '조건에 맞는 곳이 없어요' : '가고 싶은 곳을 추가해 보세요'}</div>`}
  `;
  return { title:'가이드북', body };
}
function setGuide(k, v){ S.ui.guide[k] = v; renderRoute(); }

/* ===================== 장소 추가 (＋) ===================== */
function guessSource(url){
  if(!url) return '';
  if(/youtu/.test(url)) return '유튜브';
  if(/instagram|instagr\.am/.test(url)) return '인스타';
  if(/blog\.naver/.test(url)) return '네이버 블로그';
  if(/naver/.test(url)) return '네이버 방문자리뷰';
  return '기타';
}
function handleSharedText(text, title='', url=''){
  const all = [title, text, url].join('\n');
  const found = url || (all.match(/https?:\/\/\S+/) || [''])[0];
  const lines = [title, ...String(text||'').split('\n')]
    .map(l => l.replace(/^\[[^\]]*\]\s*/, '').trim())
    .filter(l => l && !/^https?:\/\//.test(l) && l.length < 40);
  S.addCtx = { source_url:found || S.addCtx.source_url, source:guessSource(found) || S.addCtx.source, q:lines[0] || S.addCtx.q };
}
function renderAdd(){
  let autoSearch = false;
  if(S.pendingShare){ const sh = S.pendingShare; S.pendingShare = null; handleSharedText(sh.text, sh.title, sh.url); autoSearch = !!S.addCtx.q; }
  const c = S.addCtx;
  const body = `
  <div class="card">
    <div class="field" style="margin-bottom:8px"><label>장소 검색</label>
      <div class="row"><input id="addq" placeholder="가게·장소 이름 (예: 시흥 삼겹살)" value="${esc(c.q)}" onkeydown="if(event.key==='Enter')doAddSearch()" style="flex:3"><button class="btn primary" onclick="doAddSearch()" style="flex:1">검색</button></div>
    </div>
    <div class="row">
      <button class="btn sm" onclick="pasteClipboard()">📋 링크 붙여넣기</button>
      <button class="btn sm" onclick="openManualAdd()">✏️ 직접 입력</button>
    </div>
  </div>
  <div class="card">
    <div class="meta" style="margin-bottom:8px"><b>알게 된 경로</b> (새로 추가하는 장소에 저장돼요)</div>
    <div class="row">
      <select id="add_src" onchange="S.addCtx.source=this.value"><option value="">선택 안 함</option>${SOURCES.map(s=>`<option ${c.source===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <input id="add_url" placeholder="참고 링크 (블로그·유튜브·지도 등)" value="${esc(c.source_url)}" oninput="S.addCtx.source_url=this.value;const g=guessSource(this.value);if(g&&!S.addCtx.source){S.addCtx.source=g;$('#add_src').value=g}" style="margin-top:8px">
  </div>
  <div id="addres"></div>`;
  return { title:'기록하기', body, after: () => { if(autoSearch) doAddSearch(); else if(!c.q) $('#addq')?.focus(); } };
}
async function pasteClipboard(){
  try {
    const t = await navigator.clipboard.readText();
    if(!t){ toast('클립보드가 비어 있어요'); return; }
    handleSharedText(t); renderRoute();
    if(S.addCtx.q) doAddSearch();
  } catch(e){ toast('클립보드를 읽을 수 없어요. 아래 링크 칸을 길게 눌러 붙여넣어 주세요'); $('#add_url')?.focus(); }
}
async function doAddSearch(){
  const qv = $('#addq').value.trim(); S.addCtx.q = qv;
  if(!qv){ toast('검색어를 입력해 주세요'); return; }

  S.addResults = res;
  const owned = new Map(S.places.filter(p=>p.kakao_place_id).map(p => [p.kakao_place_id, p]));
  box.innerHTML = `
  ${mine.length ? `<div class="sec-title">내 가이드북에 있는 곳</div>${mine.map(p => `
    <div class="pitem"><div class="thumb">${catIcon(p.category)}</div><div class="pbody" onclick="go('#/place/${p.id}')"><div class="pname">${esc(p.name)}</div><div class="meta">${esc(p.region||'')} ${STATUS[p.status]}</div></div>
    <button class="btn sm primary" onclick="go('#/visit/new/${p.id}')">방문 추가</button></div>`).join('')}` : ''}
  <div class="sec-title">검색 결과 ${res.length}곳</div>
  ${res.length ? res.map((d,i) => { const own = owned.get(String(d.id)); return `
    <div class="card" style="padding:12px">
      <div class="pname">${catIcon(kakaoCatOf(d))} ${esc(d.place_name)}</div>
      <div class="meta">${esc(kakaoSubOf(d))} · ${esc(d.road_address_name || d.address_name)}</div>
      <div class="row" style="margin-top:8px">${own
        ? `<button class="btn sm" onclick="go('#/place/${own.id}')">이미 있음 · 보기</button><button class="btn sm primary" onclick="go('#/visit/new/${own.id}')">방문 추가</button>`
        : `<button class="btn sm primary" onclick="addFromKakao(${i},'visit')">✅ 다녀왔어요</button><button class="btn sm" onclick="addFromKakao(${i},'wish')">💭 가고 싶어요</button>`}
      </div></div>`; }).join('') : '<div class="empty">검색 결과가 없어요. ✏️ 직접 입력을 써 보세요</div>'}`;
}
async function addFromKakao(i, mode){
  const d = S.addResults[i]; if(!d) return;
  const row = { ...kakaoToPlace(d), status:'wish', source:S.addCtx.source||null, source_url:S.addCtx.source_url||null, created_by:S.profile };

  try {
    const ins = await q(sb.from('places').insert(row).select().single());
    S.places.push(ins); resetAddCtx();
    go('#/visit/new/' + ins.id);
  } catch(e){ toast('저장 실패: ' + e.message); }

async function saveWish(){

function renderPlace(id){
  const p = placeById(id); if(!p) return notFound();

    // 세부 점수 평균 (사람별)
    const scoreTable = [1,2].map(pid => {
      const ss = vs.map(v => scoresOf(v.id).find(s => s.profile_id === pid)).filter(Boolean);
      if(!ss.length) return '';
      return `<div class="kv"><span>${whoName(pid)}</span><span>${SCORE_ITEMS[p.category].map(k => { const a = avg(ss.map(s=>s.scores?.[k]).filter(x=>typeof x==='number')); return a!=null ? `${esc(k)} ${a.toFixed(1)}` : ''; }).filter(Boolean).join(' · ') || '-'}</span></div>`;

      ${p.source ? `<div class="kv"><span>알게 된 경로</span><span>${esc(p.source)}${p.source_url ? ` · <a href="${esc(p.source_url)}" target="_blank" rel="noopener">링크</a>` : ''}</span></div>` : (p.source_url ? `<div class="kv"><span>참고 링크</span><span><a href="${esc(p.source_url)}" target="_blank" rel="noopener">열기</a></span></div>` : '')}
      ${p.expected_menu ? `<div class="kv"><span>기대 포인트</span><span>${esc(p.expected_menu)}</span></div>` : ''}
      ${expected ? `<div class="kv"><span>예상 vs 실제</span><span>${won(expected)} → ${avgUnit!=null ? `<b>${won(avgUnit)}</b> (${diff>0?'+':''}${diff}%)` : '아직 몰라요'}</span></div>` : ''}
      ${(p.tags||[]).length ? `<div class="kv"><span>태그</span><span>${p.tags.map(t=>'#'+esc(t)).join(' ')}</span></div>` : ''}

  </div>

  return { title:esc(p.name), body, opts:{back:true} };
}

async function deletePlace(pid){

async function recomputePlace(pid, keepStatus=false){
  const p = placeById(pid); if(!p) return;
  const tier = tierOf(p.category, placeAvgUnit(p));
  const patch = {};
  if(tier !== p.price_tier) patch.price_tier = tier;
  if(!keepStatus && visitsOf(pid).length && p.status !== 'visited') patch.status = 'visited';
  if(Object.keys(patch).length){ await q(sb.from('places').update(patch).eq('id', pid)); Object.assign(p, patch); }
}

function readScores(pid){
  const out = {};
  $$(`.score[data-who="${pid}"]`).forEach(r => { const val = Number(r.dataset.val); if(val) out[r.dataset.key] = val; });
  return out;
}
async function saveVisit(){
  const f = S.form, p = placeById(f.placeId), cat = p.category;
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const date = $('#f_date').value; if(!date) throw new Error('날짜를 입력해 주세요');
    const extra = {};
    $$('#extraRows .erow').forEach(r => { const k = $('.e_k', r).value.trim(); const val = num($('.e_v', r).value); if(k && val != null) extra[k] = val; });
    const row = {
      place_id:p.id, visited_at:date, companions:$('#f_comp').value,
      total_amount:num($('#f_total').value), people:num($('#f_people').value) || 1,
      nights:cat==='stay' ? (num($('#f_nights').value) || 1) : null,
      booking_channel:cat==='stay' ? ($('#f_book').value || null) : null,
      extra_costs:extra, wait_minutes:cat!=='stay' ? num($('#f_wait').value) : null,
      is_detail_done:$('#f_done').checked, trip_id:f.tripId || null,
    };
    let vid = f.visitId;
    if(vid) await q(sb.from('visits').update(row).eq('id', vid));
    else { row.created_by = S.profile; const ins = await q(sb.from('visits').insert(row).select().single()); vid = ins.id; f.visitId = vid; f.key = vid; }

    // 점수
    for(const pid of [1,2]){
      const scores = readScores(pid); const line = ($(`#f_line${pid}`)?.value || '').trim();
      if(Object.keys(scores).length || line) await q(sb.from('visit_scores').upsert({ visit_id:vid, profile_id:pid, scores, one_line:line || null }));
      else await q(sb.from('visit_scores').delete().eq('visit_id', vid).eq('profile_id', pid));
    }
    // 각자 낸 금액
    for(const pid of [1,2]){
      const amt = num($(`#f_pay${pid}`).value);
      if(amt != null) await q(sb.from('visit_payments').upsert({ visit_id:vid, profile_id:pid, amount:amt }));
      else await q(sb.from('visit_payments').delete().eq('visit_id', vid).eq('profile_id', pid));
    }
    // 항목
    await q(sb.from('visit_items').delete().eq('visit_id', vid));
    const items = $$('#itemRows .irow').map((r, i) => ({ visit_id:vid, name:$('.i_name', r).value.trim(), price:num($('.i_price', r).value),
      qty:num($('.i_qty', r).value) || 1, is_recommend:$('.rec', r).classList.contains('on'), sort_order:i })).filter(x => x.name);
    if(items.length) await q(sb.from('visit_items').insert(items));
    // 사진 삭제
    for(const id of f.removePhotoIds){
      const ph = S.photos.find(x => x.id === id);
      if(ph){ await sb.storage.from('photos').remove([ph.storage_path]); await q(sb.from('photos').delete().eq('id', id)); }
    }
    // 사진 업로드
    const newIds = [];
    for(let i = 0; i < f.newPhotos.length; i++){
      btn.textContent = `사진 올리는 중 ${i+1}/${f.newPhotos.length}`;
      const n = f.newPhotos[i]; const blob = await resizeImage(n.file);
      const path = `${vid}/${uuid()}.jpg`;
      const up = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false });
      if(up.error) throw new Error('사진 업로드 실패: ' + up.error.message);
      const ins = await q(sb.from('photos').insert({ visit_id:vid, storage_path:path, is_receipt:n.receipt, created_by:S.profile }).select().single());
      newIds[i] = ins.id;
    }
    const coverId = f.coverId && f.coverId.startsWith('new') ? newIds[Number(f.coverId.slice(3))] : f.coverId;
    await q(sb.from('photos').update({ is_cover:false }).eq('visit_id', vid));
    if(coverId) await q(sb.from('photos').update({ is_cover:true }).eq('id', coverId));
    // 등급
    const gBtn = $('#f_grade .chip.on'); const g = gBtn ? gBtn.dataset.g : null;
    if(g !== (p.grade || null)) await q(sb.from('places').update({ grade:g }).eq('id', p.id));

    f.newPhotos.forEach(n => URL.revokeObjectURL(n.url));
    S.form = null;
    await loadAll(); await recomputePlace(p.id);
    toast('저장했어요');
    S.ui.placeTab[p.id] = 'visits';
    go('#/place/' + p.id);
  } catch(e){ btn.disabled = false; btn.textContent = '저장'; toast(e.message); }
}
async function deleteVisit(vid){
  if(!confirm('이 방문 기록을 삭제할까요? 사진도 함께 지워져요')) return;
  const v = S.visits.find(x => x.id === vid);
  try {
    const paths = photosOfVisit(vid).map(p => p.storage_path);
    if(paths.length) await sb.storage.from('photos').remove(paths);
    await q(sb.from('visits').delete().eq('id', vid));
    S.form = null; await loadAll(); await recomputePlace(v.place_id, true);
    toast('삭제했어요'); go('#/place/' + v.place_id);
  } catch(e){ toast('삭제 실패: ' + e.message); }
}

function renderMap(){

async function drawMainMap(){
  const el = $('#map'); if(!el) return;
  try {
    const k = await loadKakao(); if(!document.body.contains(el)) return;
    const list = mapPlaces();
    const start = S.lastPos || (list[0] ? { lat:list[0].lat, lng:list[0].lng } : { lat:37.38, lng:126.80 });
    const map = new k.maps.Map(el, { center:new k.maps.LatLng(start.lat, start.lng), level:8 });
    S.mapObj = map;
    const bounds = new k.maps.LatLngBounds();
    list.forEach(p => { const pos = new k.maps.LatLng(p.lat, p.lng); bounds.extend(pos);
      new k.maps.CustomOverlay({ position:pos, content:pinHtml(p), yAnchor:1, clickable:true }).setMap(map); });
    if(list.length > 1) map.setBounds(bounds); else if(list.length === 1) map.setCenter(new k.maps.LatLng(list[0].lat, list[0].lng));
    k.maps.event.addListener(map, 'click', () => $('#mapcard')?.classList.add('hidden'));
  } catch(e){ el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function mapPick(id){
  const p = placeById(id); const c = $('#mapcard'); if(!p || !c) return;

async function mapMyPos(){
  try { const pos = await getPos(); const k = await loadKakao(); if(S.mapObj){ S.mapObj.setCenter(new k.maps.LatLng(pos.lat, pos.lng)); S.mapObj.setLevel(6); } }
  catch(e){ toast(e.message); }
}
async function drawRouteMap(elId, pts){
  const el = document.getElementById(elId); if(!el) return;
  try {
    const k = await loadKakao(); if(!document.body.contains(el)) return;
    const valid = pts.filter(p => p.lat && p.lng);
    const c = valid[0] || { lat:37.5, lng:127.0 };
    const map = new k.maps.Map(el, { center:new k.maps.LatLng(c.lat, c.lng), level:7 });
    const bounds = new k.maps.LatLngBounds(); const path = [];
    valid.forEach((p, i) => { const pos = new k.maps.LatLng(p.lat, p.lng); path.push(pos); bounds.extend(pos);
      new k.maps.CustomOverlay({ position:pos, content:`<div class="pin" style="background:${p.day===2?'#1E3A5F':'#B3261E'}">${i+1}</div>`, yAnchor:1 }).setMap(map); });
    if(path.length > 1){ new k.maps.Polyline({ path, strokeWeight:3, strokeColor:'#B3261E', strokeOpacity:.7, strokeStyle:'shortdash' }).setMap(map); map.setBounds(bounds); }
  } catch(e){ el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function isCafe(p){ return /카페|디저트|베이커리|제과|빵/.test(p.sub_category || ''); }
function typeMatch(p, type){
  if(type === 'meal') return p.category === 'food' && !isCafe(p);
  if(type === 'cafe') return p.category === 'food' && isCafe(p);
  if(type === 'play') return p.category === 'play';
  if(type === 'stay') return p.category === 'stay';
  if(type === 'cafeplay') return (p.category === 'food' && isCafe(p)) || p.category === 'play';
  return false;
}
function estOf(p, type){
  const half = type === 'stay' ? 2 : 1; // 숙박은 1박 요금을 둘이 나눈다고 가정
  const a = placeAvgUnit(p); if(a != null) return a / half;
  if(p.expected_price) return p.expected_price / half;
  if(p.price_tier) return TIER_MID[p.category][p.price_tier-1] / half;
  return DEFAULT_EST[type];
}
async function buildPool(type, center, f){
  const km = MODE_KM[f.mode]; const out = []; const seen = new Set(S.places.map(p => p.kakao_place_id).filter(Boolean));
  for(const p of S.places){
    if(!p.lat || !typeMatch(p, type) || p.grade === 'no') continue;
    const isWish = p.status !== 'visited';
    if(isWish && !f.useWish) continue;
    if(!isWish && (!f.useVisited || !['3star','2star','1star','bogourmand'].includes(p.grade))) continue;
    if(haversine(center, p) > km.center) continue;
    const w = isWish ? (p.status === 'wish' ? 5 : 3) : (p.grade === '3star' || p.grade === '2star' ? 3 : 2);
    out.push({ key:'p:'+p.id, place:p, name:p.name, lat:p.lat, lng:p.lng, w, tag:isWish ? '💭 위시' : '⭐ 재방문', sub:p.sub_category, est:estOf(p, type) });
  }
  if(f.useNew){
    for(const code of KAKAO_CODES[type]){
      for(const page of [1,2,3]){
        const res = await kakaoCategory(code, center, km.center*1000, page);
        for(const d of res){
          if(seen.has(String(d.id))) continue; seen.add(String(d.id));
          if(type === 'meal' && /간식|술집|호프|패스트푸드/.test(d.category_name)) continue;
          if(type === 'play' && /공원|도서관|주차|교회|사찰/.test(d.category_name) && Math.random() < .6) continue;
          out.push({ key:'k:'+d.id, kakao:d, name:d.place_name, lat:+d.y, lng:+d.x, w:1, tag:'✨ 처음', sub:kakaoSubOf(d), est:DEFAULT_EST[type] });
        }
        if(res.length < 15) break;
      }
    }
  }
  return out;
}
function weightedPick(arr){
  const total = sum(arr.map(c => c.w)); if(!total) return null;
  let r = Math.random() * total;
  for(const c of arr){ r -= c.w; if(r <= 0) return c; }
  return arr[arr.length-1];
}
function pickSlot(i){
  const d = S.draftTrip, slot = d.slots[i];
  const used = new Set(d.slots.filter((s, j) => j !== i && s.cand).map(s => s.cand.key));
  let pool = (d.pool[slot.type] || []).filter(c => !used.has(c.key) && c.key !== slot.cand?.key);
  if(!pool.length) pool = (d.pool[slot.type] || []).filter(c => !used.has(c.key));
  let prev = null; for(let j = i-1; j >= 0; j--){ if(d.slots[j].cand){ prev = d.slots[j].cand; break; } }
  const step = MODE_KM[d.params.mode].step;
  let near = prev ? pool.filter(c => haversine(prev, c) <= step) : pool;
  if(!near.length) near = pool;
  const budget = num(d.params.budget);
  const others = sum(d.slots.filter((s, j) => j !== i && s.cand).map(s => s.cand.est));
  let fit = budget ? near.filter(c => others + c.est <= budget) : near;
  if(!fit.length) fit = near;
  slot.cand = weightedPick(fit);
}
async function generateTrip(){
  const f = readTripForm(); const btn = $('#tgen'); btn.disabled = true; btn.textContent = '코스 짜는 중…';
  try {
    let center = null, regionName = '';
    if(f.where === 'here'){ center = await getPos(); regionName = '내 주변'; }
    else if(f.where === 'near' || f.where === 'far'){
      const list = f.where === 'near' ? NEAR_REGIONS : FAR_REGIONS;
      regionName = list[Math.floor(Math.random() * list.length)]; center = await geocode(regionName);
    } else {
      regionName = f.region.trim(); if(!regionName) throw new Error('지역을 입력해 주세요');
      center = await geocode(regionName);
    }
    if(!center) throw new Error('지역 위치를 찾지 못했어요');
    if(!f.useWish && !f.useVisited && !f.useNew) throw new Error('후보 범위를 하나 이상 골라 주세요');
    const tpl = SLOT_TEMPLATES[f.duration];
    const pool = {};
    for(const t of [...new Set(tpl.map(s => s.type))]) pool[t] = await buildPool(t, center, f);
    S.draftTrip = { params:{ ...f }, center, regionName, pool, title:'', slots:tpl.map(s => ({ ...s, cand:null, locked:false })) };
    S.draftTrip.slots.forEach((s, i) => pickSlot(i));
    renderRoute();
  } catch(e){ btn.disabled = false; btn.textContent = '🎲 코스 뽑기'; toast(e.message); }
}
function toggleLock(i){ const s = S.draftTrip.slots[i]; if(!s.cand) return; s.locked = !s.locked; renderRoute(); }
function rerollSlot(i){ pickSlot(i); renderRoute(); }
function rerollAll(){ S.draftTrip.slots.forEach((s, i) => { if(!s.locked) s.cand = null; }); S.draftTrip.slots.forEach((s, i) => { if(!s.locked) pickSlot(i); }); renderRoute(); }
function removeSlot(i){ S.draftTrip.slots.splice(i, 1); renderRoute(); }
async function saveTrip(){
  const d = S.draftTrip, f = d.params;
  const chosen = d.slots.filter(s => s.cand); if(!chosen.length){ toast('저장할 장소가 없어요'); return; }

async function finishTrip(id){

    return `<div class="ed-sec"><h3>${GRADES[g].short} ${GRADES[g].label}</h3><div class="d">${GRADES[g].desc}</div>
      ${ps.map(p => {
        const vs = yv.filter(v => v.place_id === p.id).sort(byDateDesc);
        const lines = vs.flatMap(v => scoresOf(v.id).filter(s => s.one_line).map(s => `${whoName(s.profile_id)} “${esc(s.one_line)}”`)).slice(0,2);
        const unit = placeAvgUnit(p);
        return `<div class="ed-item">${thumbHtml(coverOfPlace(p.id), catIcon(p.category))}<div class="pbody">
          <div class="pname">${esc(p.name)} <span class="tier">${tierText(p.price_tier)}</span></div>
          <div class="meta">${catIcon(p.category)} ${esc(p.sub_category || CAT[p.category].label)} · ${esc(p.region||'')} · ${vs.length}회 방문${unit!=null ? ' · '+(p.category==='stay'?'1박 ':'1인 ')+won(unit) : ''}</div>
          ${lines.map(l => `<div class="oneline">${l}</div>`).join('')}</div></div>`;
      }).join('')}</div>`;
  }).join('');
  const starCount = places.filter(p => ['3star','2star','1star'].includes(p.grade)).length;
  return `<div class="edition">
    <div class="ed-cover"><div class="y">${year} EDITION</div><h2>보슐랭 가이드 ${year}</h2>
      <div class="meta">${whoName(1)} &amp; ${whoName(2)} · ${places.length}곳 방문 · 스타 ${starCount}곳</div></div>
    ${sections || `<div class="empty">${year}년에 등급을 받은 곳이 아직 없어요.<br>장소 상세에서 🏅 등급을 매겨 보세요</div>`}
  </div>`;
}

/* ===================== 설정 ===================== */
function openSettings(){
  modal(`<h3>설정</h3>
    <div class="card"><div class="meta" style="margin-bottom:8px">이 기기 사용자</div>
      <div class="row">${[1,2].map(id => `<button class="btn ${S.profile===id?'primary':''}" onclick="setProfile(${id})">${PROFILES[id].name}</button>`).join('')}</div></div>
    <button class="btn full" onclick="refreshAll()">🔄 새로고침</button>
    <button class="btn full" onclick="showInstallGuide()">📲 홈 화면에 설치하는 법</button>
    <button class="btn full" onclick="exportBackup()">💾 백업 파일 내려받기</button>
    <div class="sec-title">가격대 기준</div>
    <div class="card"><table class="t"><tr><th></th><th>음식·놀거리 (1인)</th><th>숙박 (1박)</th></tr>
      <tr><td>₩</td><td>~1만</td><td>~7만</td></tr><tr><td>₩₩</td><td>1~3만</td><td>7~15만</td></tr>
      <tr><td>₩₩₩</td><td>3~7만</td><td>15~30만</td></tr><tr><td>₩₩₩₩</td><td>7만~</td><td>30만~</td></tr></table></div>
    <button class="btn danger full" onclick="logout()">로그아웃</button>
    <div class="meta center" style="margin-top:12px">보슐랭 가이드 v${APP_VERSION}</div>`);
}
async function refreshAll(){ closeModal(); try { await loadAll(); renderRoute(); toast('새로 불러왔어요'); } catch(e){ toast(e.message); } }
function exportBackup(){
  const data = { exported_at:new Date().toISOString(), places:S.places, visits:S.visits, visit_scores:S.scores, visit_payments:S.payments, visit_items:S.items, photos:S.photos, trips:S.trips, trip_stops:S.stops };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `boschelin-backup-${todayStr()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function installNow(){ if(!S.installEvt) return; S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt = null; closeModal(); }
function showInstallGuide(){
  modal(`<h3>📲 홈 화면에 설치하기</h3>
    ${S.installEvt ? `<button class="btn primary full" onclick="installNow()" style="margin-bottom:12px">지금 설치하기</button>` : ''}
    <div class="card"><b>갤럭시 (크롬)</b>
      <ol style="padding-left:18px;margin:8px 0 0;font-size:14px"><li>크롬으로 이 주소를 열기</li><li>오른쪽 위 <b>⋮</b> 메뉴</li><li><b>앱 설치</b> (또는 홈 화면에 추가)</li></ol>
      <div class="meta" style="margin-top:6px">설치 후 네이버지도·유튜브 등에서 <b>공유 → 보슐랭</b>으로 바로 저장할 수 있어요</div></div>
    <div class="card"><b>아이폰 (사파리)</b>
      <ol style="padding-left:18px;margin:8px 0 0;font-size:14px"><li>사파리로 이 주소를 열기</li><li>아래쪽 <b>공유 버튼</b> (□↑)</li><li><b>홈 화면에 추가</b> → 추가</li></ol>
      <div class="meta" style="margin-top:6px">아이폰은 공유 메뉴 저장이 안 돼서, 링크를 복사한 뒤 ＋ 화면의 <b>📋 링크 붙여넣기</b>를 눌러 주세요</div></div>`);
}

boot();
</script>
